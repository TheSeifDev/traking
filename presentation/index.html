<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phantoms — أول ميتنج في السنة | الخطة الكاملة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b14;
    --bg2:#0c1220;
    --panel:#101a2e;
    --panel2:#131f38;
    --line:rgba(120,180,255,.14);
    --cyan:#27e0ff;
    --cyan2:#00b8d9;
    --violet:#8b7bff;
    --amber:#ffc24b;
    --green:#3ddc97;
    --red:#ff5d73;
    --txt:#eaf2ff;
    --muted:#9db2d0;
    --dim:#6d82a3;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:'Tajawal','Cairo',system-ui,'Segoe UI',sans-serif;}
  body{background:
    radial-gradient(1100px 700px at 85% -10%, rgba(39,224,255,.10), transparent 60%),
    radial-gradient(900px 600px at 0% 110%, rgba(139,123,255,.10), transparent 60%),
    var(--bg);
  }

  /* ---------- Deck frame ---------- */
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #slide{width:1280px;height:720px;position:relative;transform-origin:center center;
    display:none;overflow:hidden;border-radius:18px;
    background:linear-gradient(160deg,var(--bg2),var(--bg) 70%);
    box-shadow:0 30px 90px rgba(0,0,0,.55), inset 0 0 0 1px var(--line);
    padding:58px 64px;
  }
  #slide.active{display:block;animation:fade .45s ease}
  @keyframes fade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}

  /* grid backdrop */
  #slide::before{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(120,180,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(120,180,255,.05) 1px,transparent 1px);
    background-size:46px 46px;mask-image:radial-gradient(circle at 50% 30%,#000 30%,transparent 80%)}
  #slide::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(700px 300px at 80% 0%,rgba(39,224,255,.07),transparent 70%)}

  .content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}

  /* ---------- Typography ---------- */
  .kicker{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:15px;
    color:var(--cyan);letter-spacing:.5px;background:rgba(39,224,255,.08);
    border:1px solid rgba(39,224,255,.25);padding:7px 16px;border-radius:100px;width:max-content}
  .kicker.v{color:var(--violet);background:rgba(139,123,255,.10);border-color:rgba(139,123,255,.3)}
  .kicker.a{color:var(--amber);background:rgba(255,194,75,.10);border-color:rgba(255,194,75,.3)}
  .kicker.g{color:var(--green);background:rgba(61,220,151,.10);border-color:rgba(61,220,151,.3)}
  h1{font-family:'Cairo',sans-serif;font-weight:900;line-height:1.25}
  h2{font-family:'Cairo',sans-serif;font-weight:900;font-size:40px;line-height:1.3;margin:14px 0 8px}
  h2 .hl{color:var(--cyan)}
  h3{font-family:'Cairo',sans-serif;font-weight:800;font-size:23px}
  p{font-size:19px;line-height:1.85;color:var(--muted)}
  .big-quote{font-family:'Cairo';font-weight:800;font-size:27px;line-height:1.7;color:var(--txt)}

  /* ---------- Common blocks ---------- */
  .grid{display:grid;gap:18px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  .g4{grid-template-columns:repeat(4,1fr)}
  .card{background:linear-gradient(165deg,var(--panel),rgba(16,26,46,.55));
    border:1px solid var(--line);border-radius:16px;padding:22px 24px;position:relative;overflow:hidden}
  .card .ico{font-size:30px;margin-bottom:8px}
  .card h3{font-size:20px;margin-bottom:6px;display:flex;align-items:center;gap:9px}
  .card p{font-size:16.5px;line-height:1.75}
  .card.acc{border-color:rgba(39,224,255,.35)}
  .card.acc::before{content:"";position:absolute;top:0;right:0;width:120px;height:120px;
    background:radial-gradient(circle,rgba(39,224,255,.16),transparent 70%)}
  .num{font-family:'Cairo';font-weight:900;font-size:54px;color:var(--cyan);line-height:1;
    text-shadow:0 0 30px rgba(39,224,255,.35)}
  ul.clean{list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:6px}
  ul.clean li{font-size:18.5px;line-height:1.7;color:var(--muted);padding-right:30px;position:relative}
  ul.clean li::before{content:"";position:absolute;right:4px;top:11px;width:11px;height:11px;
    border-radius:3px;background:var(--cyan);box-shadow:0 0 12px rgba(39,224,255,.6);
    transform:rotate(45deg)}
  ul.clean li b{color:var(--txt)}
  .tag{display:inline-block;font-size:14px;font-weight:700;padding:4px 12px;border-radius:100px;
    background:rgba(139,123,255,.14);color:#c3baff;border:1px solid rgba(139,123,255,.3)}

  /* timeline */
  .tl{display:flex;flex-direction:column;gap:0;margin-top:8px}
  .tl-row{display:grid;grid-template-columns:128px 56px 1fr;gap:14px;align-items:stretch}
  .tl-time{font-family:'Cairo';font-weight:800;font-size:17px;color:var(--cyan);text-align:left;
    padding:11px 0;white-space:nowrap}
  .tl-rail{position:relative;display:flex;justify-content:center}
  .tl-rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
  .tl-dot{width:13px;height:13px;border-radius:50%;background:var(--bg);border:3px solid var(--cyan);
    margin-top:15px;z-index:2;box-shadow:0 0 14px rgba(39,224,255,.6)}
  .tl-body{padding:8px 0 16px}
  .tl-body h3{font-size:18.5px}
  .tl-body p{font-size:15px;line-height:1.6}
  .tl-row.soft .tl-dot{border-color:var(--violet);box-shadow:0 0 14px rgba(139,123,255,.6)}
  .tl-row.soft .tl-time{color:var(--violet)}
  .tl-row.end .tl-dot{border-color:var(--amber);box-shadow:0 0 14px rgba(255,194,75,.6)}
  .tl-row.end .tl-time{color:var(--amber)}

  /* progress + chrome */
  #bar{position:fixed;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--violet));
    z-index:50;transition:width .35s ease;box-shadow:0 0 12px rgba(39,224,255,.7)}
  #hud{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;
    align-items:center;padding:0 26px;z-index:50;pointer-events:none;font-size:13.5px;color:var(--dim)}
  #hud .brand{font-weight:800;color:var(--muted);letter-spacing:1px}
  #hud .brand span{color:var(--cyan)}
  #hud .pg{font-family:'Cairo';font-weight:800;color:var(--muted)}
  .nav{position:fixed;bottom:14px;z-index:60;display:flex;gap:10px;pointer-events:auto}
  .nav button{background:var(--panel);color:var(--txt);border:1px solid var(--line);
    width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;transition:.2s}
  .nav button:hover{background:var(--panel2);border-color:var(--cyan);color:var(--cyan)}
  #navp{left:50%;transform:translateX(-70px)}
  #navn{left:50%;transform:translateX(10px)}
  .hint{position:fixed;bottom:60px;right:26px;font-size:12.5px;color:var(--dim);z-index:50}

  /* cover */
  .ghost{position:absolute;left:56px;bottom:40px;width:300px;opacity:.9;filter:drop-shadow(0 0 40px rgba(39,224,255,.35))}
  .cover-title{font-size:76px;letter-spacing:1px}
  .cover-title .ph{background:linear-gradient(120deg,var(--cyan),var(--violet));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .cover-meta{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
  .meta-chip{display:flex;align-items:center;gap:10px;background:rgba(16,26,46,.7);
    border:1px solid var(--line);border-radius:12px;padding:12px 20px;font-size:17px;font-weight:700}
  .meta-chip .ic{font-size:22px}

  /* section number watermark */
  .wm{position:absolute;left:26px;top:18px;font-family:'Cairo';font-weight:900;font-size:150px;
    color:rgba(120,180,255,.05);line-height:1;z-index:0}

  /* rule slide */
  .rule-num{font-family:'Cairo';font-weight:900;font-size:150px;line-height:1;
    background:linear-gradient(160deg,var(--cyan),var(--violet));
    -webkit-background-clip:text;background-clip:text;color:transparent;opacity:.9}
  .vs{display:grid;grid-template-columns:1fr 60px 1fr;gap:14px;align-items:stretch}
  .vs .mid{display:flex;align-items:center;justify-content:center;font-family:'Cairo';
    font-weight:900;font-size:26px;color:var(--dim)}
  .vs .bad{border-color:rgba(255,93,115,.3);background:linear-gradient(165deg,rgba(60,20,32,.5),rgba(16,26,46,.5))}
  .vs .good{border-color:rgba(61,220,151,.35);background:linear-gradient(165deg,rgba(16,50,40,.55),rgba(16,26,46,.55))}
  .vs h4{font-family:'Cairo';font-size:19px;margin-bottom:8px}
  .vs .bad h4{color:var(--red)} .vs .good h4{color:var(--green)}
  .vs p{font-size:16px}

  /* books */
  .book{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;
    display:flex;flex-direction:column;gap:12px;transition:.25s}
  .book:hover{transform:translateY(-6px);border-color:var(--cyan);box-shadow:0 18px 40px rgba(0,0,0,.4)}
  .book img{width:100%;height:210px;object-fit:cover;border-radius:9px;box-shadow:0 10px 26px rgba(0,0,0,.45)}
  .book h3{font-size:18px;line-height:1.4}
  .book .au{font-size:14px;color:var(--dim);font-weight:700}
  .book p{font-size:14.5px;line-height:1.65}

  /* doctor */
  .doc-photo{position:absolute;left:0;bottom:0;height:600px;z-index:1;
    filter:drop-shadow(0 0 50px rgba(39,224,255,.18))}
  .stat{background:rgba(16,26,46,.75);border:1px solid var(--line);border-radius:13px;padding:13px 15px;text-align:center}
  .stat b{display:block;font-family:'Cairo';font-size:29px;color:var(--cyan);line-height:1.15}
  .stat span{font-size:13px;color:var(--muted);font-weight:700}
  .src{font-size:12.5px;color:var(--dim);line-height:1.7;margin-top:10px}
  .src a{color:var(--dim);text-decoration:underline}
  .timeline-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
  .tlm{background:rgba(16,26,46,.7);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .tlm b{display:block;font-family:'Cairo';color:var(--cyan);font-size:15px}
  .tlm span{font-size:13px;color:var(--muted);line-height:1.5;display:block;margin-top:3px}

  /* closing */
  .finale{text-align:center;justify-content:center;align-items:center;gap:18px}
  .finale .ghost2{width:120px;opacity:.95;filter:drop-shadow(0 0 35px rgba(39,224,255,.5));animation:float 3.5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

  .lead{font-size:21px;color:var(--muted);line-height:1.8;max-width:900px}
  .pill-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
  .chain{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  .chain .node{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 20px;
    font-family:'Cairo';font-weight:800;font-size:18px}
  .chain .arr{color:var(--cyan);font-size:24px;font-weight:900}
  .chain .node.head{border-color:rgba(39,224,255,.45);box-shadow:0 0 22px rgba(39,224,255,.15)}
  .note{border-right:4px solid var(--amber);background:rgba(255,194,75,.07);border-radius:0 12px 12px 0;
    padding:14px 18px;font-size:16.5px;line-height:1.75;color:#ffe2a8;margin-top:8px}
  .note.cy{border-color:var(--cyan);background:rgba(39,224,255,.06);color:#c9f4ff}
  .note.vl{border-color:var(--violet);background:rgba(139,123,255,.07);color:#d8d3ff}
</style>
</head>
<body>

<div id="bar" style="width:0"></div>

<div id="stage">
<div id="slide" class="active"></div>
</div>

<div class="nav">
  <button id="navp" onclick="go(-1)">‹</button>
  <button id="navn" onclick="go(1)">›</button>
</div>
<div class="hint">تنقل: الأسهم ← → أو مسافة</div>
<div id="hud">
  <div class="pg"><span id="pgn">1</span> / <span id="pgt">1</span></div>

</div>

/* 3 — Opening */
SLIDES.push(`

/* ---------------- Engine ---------------- */
const slideEl = document.getElementById('slide');
let idx = 0;
function render(){
  slideEl.innerHTML = SLIDES[idx];
  slideEl.classList.remove('active'); void slideEl.offsetWidth; slideEl.classList.add('active');
  document.getElementById('pgn').textContent = idx+1;
  document.getElementById('pgt').textContent = SLIDES.length;
  document.getElementById('bar').style.width = ((idx+1)/SLIDES.length*100)+'%';
}
function go(d){
  idx = Math.max(0, Math.min(SLIDES.length-1, idx+d));
  render();
}
function fit(){
  const s = Math.min(window.innerWidth/1340, window.innerHeight/790, 1.05);
  slideEl.style.transform = `scale(${s})`;
}
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '||e.key==='Enter'){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'||e.key==='Backspace'){e.preventDefault();go(-1);}
  if(e.key==='Home'){idx=0;render();}
  if(e.key==='End'){idx=SLIDES.length-1;render();}
});
window.addEventListener('resize', fit);
fit(); render();
</script>
